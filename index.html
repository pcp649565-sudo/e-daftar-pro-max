<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Дафтар Pro Max</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-main: #090d0b;
      --bg-card: #101814;
      --bg-input: #16221c;
      --border: #1f3329;
      --text-main: #eef5f0;
      --text-muted: #8fa698;
      --green: #16a34a;
      --green-bright: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --red: #dc2626;
      --red-bright: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.45;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-size: 1.35rem;
      color: var(--green-bright);
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--green-soft);
      color: var(--green-bright);
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .badge.red {
      background: var(--red-soft);
      color: var(--red-bright);
      border-color: rgba(239, 68, 68, 0.35);
    }

    h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: var(--green-bright);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green-bright);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .btn-green {
      background: var(--green);
      color: #ffffff;
    }

    .btn-green:hover {
      background: var(--green-bright);
      color: #06110a;
    }

    .btn-red {
      background: var(--red);
      color: #ffffff;
    }

    .btn-red:hover {
      background: var(--red-bright);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-outline.active {
      background: var(--green-soft);
      border-color: var(--green-bright);
      color: var(--green-bright);
    }

    .item {
      border: 1px solid var(--border);
      background: var(--bg-input);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .muted {
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    .chat-box {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--border);
      background: var(--bg-input);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .msg {
      padding: 8px 10px;
      border-radius: 8px;
      background: #101a15;
      border-left: 3px solid var(--green-bright);
      margin-bottom: 8px;
    }

    .hidden {
      display: none !important;
    }

    .status-banner {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      background: var(--red-soft);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
    }

    .status-banner.ok {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="globalAlert" class="status-banner hidden"></div>

    <!-- ВОРИДШАВӢ ВА РЕГИСТРАТСИЯ -->
    <div id="authSection" class="card" style="max-width: 480px; margin: 24px auto;">
      <div style="text-align:center; margin-bottom:14px;">
        <h1 style="color:var(--green-bright); font-size:1.6rem;">e-Дафтар Pro Max</h1>
        <p class="muted">Ворид шавед ё аккаунти нав созед</p>
      </div>

      <div class="tabs">
        <button id="tabLogin" type="button" class="btn-outline active" onclick="switchAuthMode('login')">Воридшавӣ</button>
        <button id="tabRegister" type="button" class="btn-outline" onclick="switchAuthMode('register')">Регистратсия</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div id="registerFields" class="hidden">
          <div class="field">
            <label for="fullNameInput">Ному насаби пурра</label>
            <input id="fullNameInput" type="text" placeholder="Масалан: Камолдинов Анушервон" />
          </div>

          <div class="field">
            <label for="roleInput">Нақш (Role)</label>
            <select id="roleInput">
              <option value="student">Хонанда / Волидайн (Student/Parent)</option>
              <option value="teacher">Муаллим (Teacher)</option>
              <option value="admin">Админ (Admin)</option>
            </select>
          </div>

          <div class="field">
            <label for="schoolSelect">Муассиса / Мактаб (Тоҷикистон)</label>
            <select id="schoolSelect" onchange="toggleCustomInput('schoolSelect', 'regCustomSchoolField', 'schoolCustomInput')">
              <option value="Маркази Таҳсилоти Иловагӣ">Маркази Таҳсилоти Иловагӣ</option>
              <option value="МТМУ №1 ш. Душанбе">МТМУ №1 ш. Душанбе</option>
              <option value="МТМУ №2 ш. Душанбе">МТМУ №2 ш. Душанбе</option>
              <option value="МТМУ №5 ш. Душанбе">МТМУ №5 ш. Душанбе</option>
              <option value="МТМУ №8 ш. Душанбе">МТМУ №8 ш. Душанбе</option>
              <option value="МТМУ №10 ш. Душанбе">МТМУ №10 ш. Душанбе</option>
              <option value="МТМУ №20 ш. Душанбе">МТМУ №20 ш. Душанбе</option>
              <option value="МТМУ №1 ш. Хуҷанд (вилояти Суғд)">МТМУ №1 ш. Хуҷанд (вилояти Суғд)</option>
              <option value="МТМУ №1 ш. Бохтар (вилояти Хатлон)">МТМУ №1 ш. Бохтар (вилояти Хатлон)</option>
              <option value="МТМУ №1 ш. Кӯлоб (вилояти Хатлон)">МТМУ №1 ш. Кӯлоб (вилояти Хатлон)</option>
              <option value="МТМУ №1 ш. Хоруғ (ВМКБ)">МТМУ №1 ш. Хоруғ (ВМКБ)</option>
              <option value="МТМУ №1 ш. Ваҳдат (НТМ)">МТМУ №1 ш. Ваҳдат (НТМ)</option>
              <option value="МТМУ №1 ш. Ҳисор (НТМ)">МТМУ №1 ш. Ҳисор (НТМ)</option>
              <option value="МТМУ №1 ш. Турсунзода (НТМ)">МТМУ №1 ш. Турсунзода (НТМ)</option>
              <option value="__custom__">Муассисаи дигар (дастӣ нависед)</option>
            </select>
          </div>

          <div id="regCustomSchoolField" class="field hidden">
            <label for="schoolCustomInput">Номи муассиса / мактаб</label>
            <input id="schoolCustomInput" type="text" placeholder="Номи муассиса ё мактабро нависед..." />
          </div>
        </div>

        <div class="field">
          <label for="emailInput">Почтаи электронӣ (Email)</label>
          <input id="emailInput" type="email" required placeholder="name@gmail.com" />
        </div>

        <div class="field">
          <label for="passwordInput">Парол (ҳадди ақал 6 аломат)</label>
          <input id="passwordInput" type="password" required minlength="6" placeholder="••••••••" />
        </div>

        <button id="authSubmitBtn" type="submit" class="btn-green" style="width:100%;">Ворид шудан</button>
      </form>
    </div>

    <!-- КАБИНЕТИ АСОСӢ -->
    <div id="appSection" class="hidden">
      <div class="topbar">
        <div class="brand">
          <h1>e-Дафтар Pro Max</h1>
          <p id="userMeta">Корбар: —</p>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span id="roleBadge" class="badge">ROLE</span>
          <button type="button" class="btn-red" onclick="handleLogout()">Баромад</button>
        </div>
      </div>

      <div class="nav-tabs">
        <button type="button" class="btn-outline active" data-tab="students" onclick="switchSection('students', this)">Хонандагон</button>
        <button type="button" class="btn-outline" data-tab="grades" onclick="switchSection('grades', this)">Баҳо (1–10) ва Давомот</button>
        <button type="button" class="btn-outline" data-tab="announcements" onclick="switchSection('announcements', this)">Эълонҳо</button>
        <button type="button" class="btn-outline" data-tab="chat" onclick="switchSection('chat', this)">Чат</button>
      </div>

      <!-- 1. ХОНАНДАГОН -->
      <div id="sec-students" class="card">
        <div class="item-top" style="margin-bottom:12px;">
          <h2 style="margin:0;">Рӯйхати хонандагон</h2>
          <span id="studentsCountBadge" class="badge">0 хонанда</span>
        </div>

        <div id="addStudentPanel" class="item hidden" style="margin-bottom:14px;">
          <h3>Илова кардани хонандаи нав (бе маҳдудият)</h3>
          <form id="addStudentForm" onsubmit="handleAddStudent(event)">
            <div class="grid-2">
              <div class="field">
                <label for="stName">Ному насаби хонанда</label>
                <input id="stName" type="text" required placeholder="Ному насаб" />
              </div>

              <div class="field">
                <label for="stSchoolSelect">Мактаб / Муассиса (Тоҷикистон)</label>
                <select id="stSchoolSelect" onchange="toggleCustomInput('stSchoolSelect', 'stCustomSchoolField', 'stSchoolCustom')">
                  <option value="Маркази Таҳсилоти Иловагӣ">Маркази Таҳсилоти Иловагӣ</option>
                  <option value="МТМУ №1 ш. Душанбе">МТМУ №1 ш. Душанбе</option>
                  <option value="МТМУ №2 ш. Душанбе">МТМУ №2 ш. Душанбе</option>
                  <option value="МТМУ №5 ш. Душанбе">МТМУ №5 ш. Душанбе</option>
                  <option value="МТМУ №8 ш. Душанбе">МТМУ №8 ш. Душанбе</option>
                  <option value="МТМУ №10 ш. Душанбе">МТМУ №10 ш. Душанбе</option>
                  <option value="МТМУ №20 ш. Душанбе">МТМУ №20 ш. Душанбе</option>
                  <option value="МТМУ №1 ш. Хуҷанд (вилояти Суғд)">МТМУ №1 ш. Хуҷанд (вилояти Суғд)</option>
                  <option value="МТМУ №1 ш. Бохтар (вилояти Хатлон)">МТМУ №1 ш. Бохтар (вилояти Хатлон)</option>
                  <option value="МТМУ №1 ш. Кӯлоб (вилояти Хатлон)">МТМУ №1 ш. Кӯлоб (вилояти Хатлон)</option>
                  <option value="МТМУ №1 ш. Хоруғ (ВМКБ)">МТМУ №1 ш. Хоруғ (ВМКБ)</option>
                  <option value="МТМУ №1 ш. Ваҳдат (НТМ)">МТМУ №1 ш. Ваҳдат (НТМ)</option>
                  <option value="МТМУ №1 ш. Ҳисор (НТМ)">МТМУ №1 ш. Ҳисор (НТМ)</option>
                  <option value="МТМУ №1 ш. Турсунзода (НТМ)">МТМУ №1 ш. Турсунзода (НТМ)</option>
                  <option value="__custom__">Муассисаи дигар (дастӣ нависед)</option>
                </select>
              </div>

              <div id="stCustomSchoolField" class="field hidden">
                <label for="stSchoolCustom">Номи мактаб / муассисаи дигар</label>
                <input id="stSchoolCustom" type="text" placeholder="Номи муассисаро нависед..." />
              </div>

              <div class="field">
                <label for="stClass">Синф</label>
                <input id="stClass" type="text" placeholder="Масалан: 9-А" />
              </div>

              <div class="field">
                <label for="stCode">Рамз / ID хонанда (ихтиёрӣ)</label>
                <input id="stCode" type="text" placeholder="Масалан: ST-2010" />
              </div>
            </div>
            <button type="submit" class="btn-green">Сабт кардани хонанда</button>
          </form>
        </div>

        <div id="studentsList"></div>
      </div>

      <!-- 2. БАҲО (1-10) ВА ДАВОМОТ -->
      <div id="sec-grades" class="card hidden">
        <h2>Баҳогузорӣ (1–10) ва Давомот</h2>

        <div id="gradeFormPanel" class="item hidden" style="margin-bottom:14px;">
          <h3>Гузоштани баҳо ва қайди давомот</h3>
          <form id="gradeForm" onsubmit="handleSaveGrade(event)">
            <div class="grid-2">
              <div class="field">
                <label for="grStudentSelect">Хонанда</label>
                <select id="grStudentSelect" required></select>
              </div>

              <div class="field">
                <label for="grSubjectSelect">Фан (Тоҷикистон)</label>
                <select id="grSubjectSelect" required onchange="toggleCustomInput('grSubjectSelect', 'customSubjectField', 'grSubjectCustom')">
                  <option value="Забони тоҷикӣ">Забони тоҷикӣ</option>
                  <option value="Адабиёти тоҷик">Адабиёти тоҷик</option>
                  <option value="Забони русӣ">Забони русӣ</option>
                  <option value="Адабиёти рус">Адабиёти рус</option>
                  <option value="Забони англисӣ">Забони англисӣ</option>
                  <option value="Математика">Математика</option>
                  <option value="Алгебра">Алгебра</option>
                  <option value="Геометрия">Геометрия</option>
                  <option value="Информатика">Информатика</option>
                  <option value="Физика">Физика</option>
                  <option value="Химия">Химия</option>
                  <option value="Биология">Биология</option>
                  <option value="География">География</option>
                  <option value="Таърихи халқи тоҷик">Таърихи халқи тоҷик</option>
                  <option value="Таърихи умумӣ">Таърихи умумӣ</option>
                  <option value="Ҳуқуқи инсон / Асосҳои давлат ва ҳуқуқ">Ҳуқуқи инсон / Асосҳои давлат ва ҳуқуқ</option>
                  <option value="Технологияи иттилоотӣ / Меҳнат">Технологияи иттилоотӣ / Меҳнат</option>
                  <option value="Тарбияи ҷисмонӣ">Тарбияи ҷисмонӣ</option>
                  <option value="Санъати тасвирӣ / Нақшакашӣ">Санъати тасвирӣ / Нақшакашӣ</option>
                  <option value="Мусиқӣ / Фарҳанг">Мусиқӣ / Фарҳанг</option>
                  <option value="__custom__">Фанни дигар (дастӣ)</option>
                </select>
              </div>

              <div id="customSubjectField" class="field hidden">
                <label for="grSubjectCustom">Номи фанни дигар</label>
                <input id="grSubjectCustom" type="text" placeholder="Номи фанро нависед..." />
              </div>

              <div class="field">
                <label for="grScore">Баҳо (аз 1 то 10)</label>
                <input id="grScore" type="number" min="1" max="10" required placeholder="1 - 10" />
              </div>

              <div class="field">
                <label for="grAttendance">Давомот</label>
                <select id="grAttendance">
                  <option value="Ҳозир">Ҳозир</option>
                  <option value="Ғоиб">Ғоиб</option>
                  <option value="Дер кард">Дер кард</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn-green">Сабти баҳо ва давомот</button>
          </form>
        </div>

        <div id="gradesList"></div>
      </div>

      <!-- 3. ЭЪЛОНҲО -->
      <div id="sec-announcements" class="card hidden">
        <h2>Эълонҳои расмӣ</h2>

        <div id="announcementPanel" class="item hidden" style="margin-bottom:14px;">
          <h3>Навиштани эълони нав</h3>
          <form id="announcementForm" onsubmit="handleAddAnnouncement(event)">
            <div class="field">
              <label for="annTitle">Сарлавҳа</label>
              <input id="annTitle" type="text" required placeholder="Сарлавҳаи эълон" />
            </div>
            <div class="field">
              <label for="annBody">Матни эълон</label>
              <textarea id="annBody" rows="3" required placeholder="Матни муфассал..."></textarea>
            </div>
            <button type="submit" class="btn-green">Интишори эълон</button>
          </form>
        </div>

        <div id="announcementsList"></div>
      </div>

      <!-- 4. ЧАТ -->
      <div id="sec-chat" class="card hidden">
        <h2>Чати умумӣ / мактабӣ</h2>
        <div id="chatBox" class="chat-box"></div>
        <form id="chatForm" onsubmit="handleSendMessage(event)" style="display:flex; gap:8px;">
          <input id="chatInput" type="text" required placeholder="Паём нависед..." />
          <button type="submit" class="btn-green">Фиристодан</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "edaftar-pro-max.firebaseapp.com",
      databaseURL: "https://edaftar-pro-max-default-rtdb.firebaseio.com",
      projectId: "edaftar-pro-max",
      storageBucket: "edaftar-pro-max.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function safeKey(raw, fallback = "item") {
      const val = String(raw ?? "")
        .trim()
        .replace(/[.#$\[\]\/]/g, "_")
        .replace(/\s+/g, "_");
      return val || fallback;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showBanner(msg, isOk = false) {
      const el = document.getElementById("globalAlert");
      el.textContent = msg;
      el.className = isOk ? "status-banner ok" : "status-banner";
      el.classList.remove("hidden");
    }

    function hideBanner() {
      document.getElementById("globalAlert").classList.add("hidden");
    }

    function toggleCustomInput(selectId, fieldId, inputId) {
      const sel = document.getElementById(selectId);
      const field = document.getElementById(fieldId);
      const input = document.getElementById(inputId);
      const isCustom = sel.value === "__custom__";
      field.classList.toggle("hidden", !isCustom);
      input.required = isCustom;
      if (!isCustom) input.value = "";
    }

    function resolveSelectOrCustom(selectId, customInputId, fallback = "") {
      const selVal = document.getElementById(selectId).value;
      if (selVal === "__custom__") {
        return document.getElementById(customInputId).value.trim() || fallback;
      }
      return selVal || fallback;
    }

    let authMode = "login";
    let currentUser = null;
    let currentProfile = { fullName: "Корбар", role: "student", school: "" };
    let studentsCache = {};

    function canManageSchool() {
      const role = currentProfile.role || "student";
      return role === "teacher" || role === "admin";
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const isReg = mode === "register";
      document.getElementById("tabLogin").classList.toggle("active", !isReg);
      document.getElementById("tabRegister").classList.toggle("active", isReg);
      document.getElementById("registerFields").classList.toggle("hidden", !isReg);
      document.getElementById("authSubmitBtn").textContent = isReg ? "Бақайдгирӣ" : "Ворид шудан";
      hideBanner();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideBanner();

      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      try {
        if (authMode === "register") {
          const fullName = document.getElementById("fullNameInput").value.trim();
          const role = document.getElementById("roleInput").value;
          const school = resolveSelectOrCustom("schoolSelect", "schoolCustomInput", "Мактаб");

          if (!fullName) {
            showBanner("Лутфан ному насаби пурраро ворид кунед.");
            return;
          }

          const cred = await auth.createUserWithEmailAndPassword(email, password);
          const uid = safeKey(cred.user.uid, "user");

          await db.ref(`users/${uid}`).set({
            uid: cred.user.uid,
            fullName,
            role,
            school,
            email,
            createdAt: Date.now()
          });

          try {
            await cred.user.sendEmailVerification();
          } catch (_) {}

          showBanner("Аккаунт сохта шуд! Линки тасдиқ ба почтаи шумо фиристода шуд.", true);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        showBanner("Хатогӣ: " + (err.message || err));
      }
    }

    async function handleLogout() {
      await auth.signOut();
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        currentUser = null;
        document.getElementById("authSection").classList.remove("hidden");
        document.getElementById("appSection").classList.add("hidden");
        return;
      }

      currentUser = user;
      const uid = safeKey(user.uid, "user");

      try {
        const snap = await db.ref(`users/${uid}`).get();
        currentProfile = snap.exists()
          ? snap.val()
          : { fullName: user.email || "Корбар", role: "student", school: "" };
      } catch (_) {
        currentProfile = { fullName: user.email || "Корбар", role: "student", school: "" };
      }

      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("appSection").classList.remove("hidden");

      const role = currentProfile.role || "student";
      document.getElementById("userMeta").textContent =
        `${currentProfile.fullName} (${user.email || ""})`;

      const badge = document.getElementById("roleBadge");
      badge.textContent = role.toUpperCase();
      badge.className = role === "admin" ? "badge red" : "badge";

      const canManage = canManageSchool();
      document.getElementById("addStudentPanel").classList.toggle("hidden", !canManage);
      document.getElementById("gradeFormPanel").classList.toggle("hidden", !canManage);
      document.getElementById("announcementPanel").classList.toggle("hidden", !canManage);

      startRealtimeListeners();
    });

    function switchSection(secName, btnEl) {
      for (const name of ["students", "grades", "announcements", "chat"]) {
        document.getElementById(`sec-${name}`).classList.toggle("hidden", name !== secName);
      }
      document.querySelectorAll(".nav-tabs button").forEach((b) => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
    }

    async function handleAddStudent(e) {
      e.preventDefault();
      hideBanner();

      if (!canManageSchool()) {
        showBanner("Танҳо муаллим ё админ метавонад хонанда илова кунад.");
        return;
      }

      const fullName = document.getElementById("stName").value.trim();
      const school = resolveSelectOrCustom(
        "stSchoolSelect",
        "stSchoolCustom",
        currentProfile.school || "Мактаб"
      );
      const className = document.getElementById("stClass").value.trim() || "Синф";
      const rawCode = document.getElementById("stCode").value.trim();

      if (!fullName) {
        showBanner("Ному насаби хонандаро нависед.");
        return;
      }

      const uniqueSuffix = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const keyPartSchool = safeKey(school, "school");
      const keyPartCode = safeKey(rawCode || fullName, "st");
      const studentKey = safeKey(`${keyPartSchool}_${keyPartCode}_${uniqueSuffix}`, `st_${uniqueSuffix}`);

      try {
        await db.ref(`students/${studentKey}`).set({
          id: studentKey,
          fullName,
          school,
          className,
          studentCode: rawCode || `ST-${Date.now().toString().slice(-5)}`,
          addedBy: currentProfile.fullName || currentUser.email,
          createdAt: Date.now()
        });

        document.getElementById("stName").value = "";
        document.getElementById("stClass").value = "";
        document.getElementById("stCode").value = "";
        document.getElementById("stName").focus();

        showBanner(`Хонанда "${fullName}" илова шуд! Метавонед боз илова кунед.`, true);
      } catch (err) {
        showBanner("Хато ҳангоми сабти хонанда: " + (err.message || err));
      }
    }

    async function handleDeleteStudent(studentKey) {
      if (!canManageSchool()) return;
      if (!confirm("Ин хонандаро пок кардан мехоҳед?")) return;
      try {
        await db.ref(`students/${safeKey(studentKey)}`).remove();
        showBanner("Хонанда пок карда шуд.", true);
      } catch (err) {
        showBanner("Хато ҳангоми пок кардан: " + (err.message || err));
      }
    }

    async function handleSaveGrade(e) {
      e.preventDefault();
      hideBanner();

      if (!canManageSchool()) {
        showBanner("Танҳо муаллим ё админ метавонад баҳо гузорад.");
        return;
      }

      const studentKey = document.getElementById("grStudentSelect").value;
      const subject = resolveSelectOrCustom("grSubjectSelect", "grSubjectCustom", "");
      const score = Number(document.getElementById("grScore").value);
      const attendance = document.getElementById("grAttendance").value;

      if (!studentKey) {
        showBanner("Аввал хонандаро интихоб кунед.");
        return;
      }
      if (!subject) {
        showBanner("Лутфан фанро интихоб ё нависед.");
        return;
      }
      if (Number.isNaN(score) || score < 1 || score > 10) {
        showBanner("Баҳо бояд аз 1 то 10 бошад.");
        return;
      }

      const st = studentsCache[studentKey] || {};
      const safeKeyId = safeKey(studentKey, "student");

      try {
        await db.ref(`grades/${safeKeyId}`).push({
          studentKey: safeKeyId,
          studentName: st.fullName || safeKeyId,
          subject,
          score,
          attendance,
          teacherName: currentProfile.fullName || currentUser.email,
          createdAt: Date.now()
        });

        document.getElementById("grScore").value = "";
        if (document.getElementById("grSubjectSelect").value === "__custom__") {
          document.getElementById("grSubjectCustom").value = "";
        }
        showBanner("Баҳо ва давомот сабт шуд!", true);
      } catch (err) {
        showBanner("Хато ҳангоми сабти баҳо: " + (err.message || err));
      }
    }

    async function handleDeleteGrade(studentKey, gradeId) {
      if (!canManageSchool()) {
        showBanner("Танҳо муаллим ё админ метавонад баҳоро пок кунад.");
        return;
      }
      try {
        await db.ref(`grades/${safeKey(studentKey)}/${safeKey(gradeId)}`).remove();
        showBanner("Баҳо пок карда шуд!", true);
      } catch (err) {
        showBanner("Хато ҳангоми пок кардани баҳо: " + (err.message || err));
      }
    }

    async function handleAddAnnouncement(e) {
      e.preventDefault();
      hideBanner();

      const title = document.getElementById("annTitle").value.trim();
      const body = document.getElementById("annBody").value.trim();

      try {
        await db.ref("announcements").push({
          title,
          body,
          author: currentProfile.fullName || currentUser.email,
          role: currentProfile.role || "user",
          createdAt: Date.now()
        });
        document.getElementById("announcementForm").reset();
        showBanner("Эълон нашр шуд!", true);
      } catch (err) {
        showBanner("Хато ҳангоми нашри эълон: " + (err.message || err));
      }
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      hideBanner();

      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      try {
        await db.ref("chat").push({
          sender: currentProfile.fullName || currentUser.email,
          role: currentProfile.role || "user",
          text,
          createdAt: Date.now()
        });
        input.value = "";
      } catch (err) {
        showBanner("Хато ҳангоми фиристодани паём: " + (err.message || err));
      }
    }

    let listenersStarted = false;

    function startRealtimeListeners() {
      if (listenersStarted) return;
      listenersStarted = true;

      db.ref("students").on("value", (snap) => {
        studentsCache = snap.val() || {};
        renderStudents(studentsCache);
        renderStudentSelect(studentsCache);
      });

      db.ref("grades").on("value", (snap) => {
        renderGrades(snap.val() || {});
      });

      db.ref("announcements").on("value", (snap) => {
        renderAnnouncements(snap.val() || {});
      });

      db.ref("chat").limitToLast(60).on("value", (snap) => {
        renderChat(snap.val() || {});
      });
    }

    function renderStudents(data) {
      const container = document.getElementById("studentsList");
      const entries = Object.entries(data);
      document.getElementById("studentsCountBadge").textContent = `${entries.length} хонанда`;

      if (!entries.length) {
        container.innerHTML = `<p class="muted">Ҳоло хонанда сабт нашудааст.</p>`;
        return;
      }

      const canManage = canManageSchool();
      container.innerHTML = entries.reverse().map(([key, st]) => `
        <div class="item">
          <div class="item-top">
            <strong>${escapeHtml(st.fullName)}</strong>
            <div class="item-actions">
              <span class="badge">${escapeHtml(st.className || "Синф")}</span>
              ${canManage ? `<button type="button" class="btn-red btn-sm" onclick="handleDeleteStudent('${escapeHtml(key)}')">Пок кардан</button>` : ""}
            </div>
          </div>
          <div class="muted">Мактаб: ${escapeHtml(st.school || "—")} | Рамз: ${escapeHtml(st.studentCode || "—")}</div>
        </div>
      `).join("");
    }

    function renderStudentSelect(data) {
      const select = document.getElementById("grStudentSelect");
      const entries = Object.entries(data);
      if (!entries.length) {
        select.innerHTML = `<option value="">Аввал хонанда илова кунед</option>`;
        return;
      }
      select.innerHTML = entries.map(([key, st]) =>
        `<option value="${escapeHtml(key)}">${escapeHtml(st.fullName)} (${escapeHtml(st.className || "")})</option>`
      ).join("");
    }

    function renderGrades(data) {
      const container = document.getElementById("gradesList");
      const rows = [];

      Object.entries(data).forEach(([studentKey, studentGrades]) => {
        if (studentGrades && typeof studentGrades === "object") {
          Object.entries(studentGrades).forEach(([gradeId, item]) => {
            rows.push({
              ...item,
              studentKey: item.studentKey || studentKey,
              gradeId
            });
          });
        }
      });

      rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      if (!rows.length) {
        container.innerHTML = `<p class="muted">Ҳоло баҳо ё давомот сабт нашудааст.</p>`;
        return;
      }

      const canManage = canManageSchool();
      container.innerHTML = rows.map((r) => {
        const isAbsent = r.attendance === "Ғоиб";
        return `
          <div class="item">
            <div class="item-top">
              <strong>${escapeHtml(r.studentName)} — ${escapeHtml(r.subject)}</strong>
              <div class="item-actions">
                <span class="badge ${isAbsent ? "red" : ""}">Баҳо: ${escapeHtml(r.score)}/10 • ${escapeHtml(r.attendance)}</span>
                ${canManage ? `<button type="button" class="btn-red btn-sm" onclick="handleDeleteGrade('${escapeHtml(r.studentKey)}', '${escapeHtml(r.gradeId)}')">Пок кардан</button>` : ""}
              </div>
            </div>
            <div class="muted">Муаллим: ${escapeHtml(r.teacherName || "—")}</div>
          </div>
        `;
      }).join("");
    }

    function renderAnnouncements(data) {
      const container = document.getElementById("announcementsList");
      const list = Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (!list.length) {
        container.innerHTML = `<p class="muted">Ҳоло эълон нест.</p>`;
        return;
      }

      container.innerHTML = list.map((a) => `
        <div class="item">
          <div class="item-top">
            <strong>${escapeHtml(a.title)}</strong>
            <span class="badge">${escapeHtml(a.role || "info")}</span>
          </div>
          <p style="margin:6px 0;">${escapeHtml(a.body)}</p>
          <div class="muted">Муаллиф: ${escapeHtml(a.author || "—")}</div>
        </div>
      `).join("");
    }

    function renderChat(data) {
      const box = document.getElementById("chatBox");
      const list = Object.values(data).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      if (!list.length) {
        box.innerHTML = `<p class="muted">Ҳоло паём нест. Аввалин паёмро нависед!</p>`;
        return;
      }

      box.innerHTML = list.map((m) => `
        <div class="msg">
          <div class="item-top">
            <strong>${escapeHtml(m.sender)}</strong>
            <span class="muted">${escapeHtml(m.role || "")}</span>
          </div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join("");

      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
